<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atmanOS | AUGMNTD Pathway Node</title>
    <meta name="description" content="Temporal Value Map Interface. 4D Economic Navigation.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* -- XENIAL PHYSICS PALETTE -- */
        :root {
            --void-deep: #030304;
            --void-light: #0a0a0f;
            --xenial-gold: #FFD700;
            --xenial-gold-dim: rgba(255, 215, 0, 0.1);
            --coherence-teal: #00f3ff;
            --entropy-red: #ff3333;
            --memory-purple: #9d4edd;
            --glass-panel: rgba(5, 5, 8, 0.95);
        }

        body {
            background-color: var(--void-deep);
            color: #c0c0c0;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            touch-action: none;
        }

        /* -- VIBRATIONAL SUBSTRATE -- */
        .frequency-field {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(157, 78, 221, 0.05) 0%, transparent 60%),
                linear-gradient(0deg, transparent 24%, rgba(255, 215, 0, 0.02) 25%, transparent 26%),
                linear-gradient(90deg, transparent 24%, rgba(255, 215, 0, 0.02) 25%, transparent 26%);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            animation: substrate-shift 120s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes substrate-shift {
            0% { background-position: center, 0 0, 0 0; }
            100% { background-position: center, 0 40px, 40px 0; }
        }

        /* -- UI COMPONENTS -- */
        .font-tech { font-family: 'Courier New', monospace; letter-spacing: 0.05em; }
        
        .panel {
            background: var(--glass-panel);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }

        /* -- MEMORY LAYERS VISUALIZATION -- */
        .memory-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            height: 100px;
            width: 100%;
            padding: 4px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .memory-layer {
            flex: 1;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.5s ease;
            position: relative;
        }
        
        .memory-layer.active { background: rgba(157, 78, 221, 0.2); border-color: var(--memory-purple); }
        .memory-layer::after {
            content: attr(data-label);
            position: absolute;
            left: 4px; top: 50%; transform: translateY(-50%);
            font-size: 8px; font-family: monospace; color: rgba(255,255,255,0.3);
        }

        /* -- TOOLS -- */
        .tool-btn {
            position: relative;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.01));
        }
        
        .tool-btn:hover { border-color: rgba(255,255,255,0.2); }
        .tool-btn.active {
            background: rgba(255, 215, 0, 0.05);
            border-color: var(--xenial-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }

        /* -- COHERENCE COMPASS -- */
        .compass-ring {
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .compass-needle {
            width: 2px; height: 40%;
            background: var(--coherence-teal);
            position: absolute;
            bottom: 50%; left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--coherence-teal);
        }
        .compass-label {
            position: absolute;
            font-size: 8px;
            color: gray;
            font-family: monospace;
        }
        .compass-n { top: 4px; color: var(--coherence-teal); }
        .compass-s { bottom: 4px; color: var(--entropy-red); }
        .compass-e { right: 4px; }
        .compass-w { left: 4px; }

        /* -- ANIMATIONS -- */
        .pulse-gold { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

    </style>
</head>
<body class="h-screen flex flex-col selection:bg-[var(--xenial-gold)] selection:text-black">

    <div class="frequency-field"></div>

    <!-- HEADER: The Temporal Deck -->
    <header class="h-14 flex items-center justify-between px-6 bg-black/80 border-b border-white/10 z-50 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <div class="w-6 h-6 border border-[var(--xenial-gold)] rotate-45 flex items-center justify-center">
                <div class="w-3 h-3 bg-[var(--xenial-gold)] opacity-80"></div>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-[0.2em] text-white">
                    AUGMNTD<span class="text-[var(--xenial-gold)]">PATHWAY</span>
                </h1>
                <p class="text-[9px] text-[var(--memory-purple)] font-tech uppercase tracking-widest">
                    Temporal Cartography // v4.0
                </p>
            </div>
        </div>
        
        <div class="flex gap-6 items-center">
            <div id="status-stream" class="hidden lg:block text-[10px] font-tech text-gray-500 w-48 text-right">
                AWAITING RESONANCE...
            </div>
            <label for="fileInput" class="border border-[var(--xenial-gold)] text-[var(--xenial-gold)] hover:bg-[var(--xenial-gold)] hover:text-black px-4 py-1 text-[9px] cursor-pointer transition-all uppercase tracking-[0.15em] font-bold">
                Load Substrate
            </label>
            <button id="downloadBtn" class="text-gray-500 hover:text-white text-[9px] uppercase tracking-[0.15em] transition-colors">
                Crystalize
            </button>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
        </div>
    </header>

    <!-- MAIN: The 4D Value Space -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- CANVAS: The Actualization Plane -->
        <div id="canvas-container" class="flex-1 relative flex items-center justify-center overflow-hidden cursor-none touch-none bg-[#050505]">
            
            <div id="placeholder-text" class="absolute text-center pointer-events-none z-10 opacity-70">
                <div class="w-12 h-12 border-l border-t border-[var(--xenial-gold)] mx-auto mb-4 animate-pulse"></div>
                <h2 class="text-white text-sm font-serif tracking-widest mb-1">MAPPING MODE ACTIVE</h2>
                <p class="text-[9px] text-gray-500 font-tech">Upload subject to begin 4D Navigation.</p>
            </div>

            <canvas id="editor" class="max-w-full max-h-full transition-all duration-500 shadow-2xl shadow-black"></canvas>
            
            <!-- Temporal Cursor -->
            <div id="temporal-cursor" class="fixed pointer-events-none hidden z-50 flex items-center justify-center" style="transform: translate(-50%, -50%);">
                <!-- Current Time T0 -->
                <div class="absolute w-full h-full border border-white/60 rounded-full animate-[spin_3s_linear_infinite]"></div>
                <!-- Future Potential -->
                <div class="absolute w-[120%] h-[120%] border border-dashed border-[var(--coherence-teal)] rounded-full opacity-50 animate-[spin_8s_linear_infinite]"></div>
                <!-- Past Memory -->
                <div class="absolute w-[80%] h-[80%] border border-[var(--memory-purple)] rounded-full opacity-50"></div>
                
                <div id="cursor-label" class="absolute top-full mt-4 text-[8px] font-tech text-white/80 whitespace-nowrap bg-black/80 px-2 py-1 border-l-2 border-[var(--xenial-gold)]">
                    τₖ: CALC...
                </div>
            </div>
        </div>

        <!-- SIDEBAR: The Navigational Instruments -->
        <aside class="w-80 panel flex flex-col z-40 p-5 gap-6 overflow-y-auto">
            
            <!-- INSTRUMENT 1: The Coherence Compass -->
            <div class="text-center">
                <div class="text-[9px] text-gray-500 font-tech uppercase tracking-[0.2em] mb-3">Coherence Compass</div>
                <div class="compass-ring bg-black/40">
                    <div class="compass-label compass-n">τ=1</div>
                    <div class="compass-label compass-s">τ=0</div>
                    <div class="compass-label compass-e">FUT</div>
                    <div class="compass-label compass-w">MEM</div>
                    <div id="compass-needle" class="compass-needle"></div>
                    <div class="w-2 h-2 bg-white rounded-full z-10"></div>
                </div>
                <div class="mt-2 text-[10px] font-mono text-[var(--coherence-teal)]" id="compass-val">τₖ: 0.00</div>
            </div>

            <!-- INSTRUMENT 2: The Memory Sextant (Layers) -->
            <div>
                <div class="text-[9px] text-gray-500 font-tech uppercase tracking-[0.2em] mb-2 flex justify-between">
                    <span>Memory Sextant</span>
                    <span class="text-[var(--memory-purple)]">DEPTH MAP</span>
                </div>
                <div class="memory-stack" id="memory-stack">
                    <div class="memory-layer" id="layer-m3" data-label="M3 [FOUNDATION]"></div>
                    <div class="memory-layer" id="layer-m2" data-label="M2 [STRUCTURAL]"></div>
                    <div class="memory-layer" id="layer-m1" data-label="M1 [PATTERN]"></div>
                    <div class="memory-layer active" id="layer-m0" data-label="M0 [SURFACE]"></div>
                </div>
            </div>

            <!-- NAVIGATION MODES (Tools) -->
            <div class="space-y-3">
                <div class="text-[9px] text-gray-500 font-tech uppercase tracking-[0.2em] border-b border-white/5 pb-1">Flow Patterns</div>
                
                <button id="mode-cascade" class="tool-btn w-full py-3 px-4 flex items-center justify-between group active">
                    <div class="text-left">
                        <span class="block text-[10px] font-bold tracking-widest text-white">FORWARD CASCADE</span>
                        <span class="block text-[8px] text-gray-500 font-tech">Create Potential (Ingression)</span>
                    </div>
                    <span class="text-[var(--coherence-teal)]">→</span>
                </button>

                <button id="mode-retro" class="tool-btn w-full py-3 px-4 flex items-center justify-between group">
                    <div class="text-left">
                        <span class="block text-[10px] font-bold tracking-widest text-white">RETRO ILLUMINATION</span>
                        <span class="block text-[8px] text-gray-500 font-tech">Validate Past (Highlight)</span>
                    </div>
                    <span class="text-[var(--xenial-gold)]">⇜</span>
                </button>

                <button id="mode-standing" class="tool-btn w-full py-3 px-4 flex items-center justify-between group">
                    <div class="text-left">
                        <span class="block text-[10px] font-bold tracking-widest text-white">STANDING WAVE</span>
                        <span class="block text-[8px] text-gray-500 font-tech">Stabilize Resonance (Heal)</span>
                    </div>
                    <span class="text-[var(--memory-purple)]">⇄</span>
                </button>
            </div>

            <!-- PARAMETERS -->
            <div class="space-y-4 mt-2">
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-[9px] text-gray-400 font-tech uppercase">Scalar Radius</label>
                        <span id="val-radius" class="text-[9px] font-mono text-[var(--xenial-gold)]">100px</span>
                    </div>
                    <input type="range" id="radius" min="20" max="400" value="100" class="w-full h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                </div>
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-[9px] text-gray-400 font-tech uppercase">XNM Amplitude</label>
                        <span id="val-power" class="text-[9px] font-mono text-[var(--xenial-gold)]">0.50</span>
                    </div>
                    <input type="range" id="power" min="1" max="100" value="50" class="w-full h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <!-- META-CONTROLS -->
            <div class="mt-auto grid grid-cols-2 gap-2">
                <button id="undoBtn" class="py-2 border border-white/10 hover:bg-white/5 text-[8px] font-tech uppercase text-gray-500 hover:text-white transition-colors">
                    Revert @T-1
                </button>
                <button id="resetBtn" class="py-2 border border-white/10 hover:bg-red-900/20 text-[8px] font-tech uppercase text-gray-500 hover:text-red-400 transition-colors">
                    Collapse Field
                </button>
            </div>
        </aside>
    </main>

    <script>
        // -- AUGMNTD KERNEL INIT --
        const canvas = document.getElementById('editor');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        const cursor = document.getElementById('temporal-cursor');
        const cursorLabel = document.getElementById('cursor-label');
        const statusStream = document.getElementById('status-stream');
        
        // Instrument Elements
        const compassNeedle = document.getElementById('compass-needle');
        const compassVal = document.getElementById('compass-val');
        const memoryLayers = {
            m0: document.getElementById('layer-m0'),
            m1: document.getElementById('layer-m1'),
            m2: document.getElementById('layer-m2'),
            m3: document.getElementById('layer-m3')
        };

        // State & Physics
        let originalImage = null;
        let history = []; // The Memory Stack
        let historyStep = -1;
        let isDragging = false;
        
        // Navigation Modes (Mapped to XQE Flow Patterns)
        const modes = {
            CASCADE: 'cascade',   // Forward Propagation (Ingression/Distort)
            RETRO: 'retro',       // Backward Illumination (Brightness/Contrast pump)
            STANDING: 'standing'  // Standing Wave (Smoothing/Stabilization)
        };
        let currentMode = modes.CASCADE;
        
        let radius = 100;
        let amplitude = 0.5; // XNM Value

        // -- ORACLE LOGIC (Status Stream) --
        const messages = [
            "Detecting Harmonic Niche...",
            "Scanning Memory Depth...",
            "Validating Coherence...",
            "Retroactive Illumination Active",
            "Standing Wave Established"
        ];
        setInterval(() => {
            statusStream.innerText = messages[Math.floor(Math.random() * messages.length)];
        }, 5000);

        // -- CANVAS LOGIC --

        function resizeCanvas() {
            if (!originalImage) return;
            const containerW = container.clientWidth;
            const containerH = container.clientHeight;
            const imgRatio = originalImage.width / originalImage.height;
            const containerRatio = containerW / containerH;
            
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;

            let finalW, finalH;
            if (imgRatio > containerRatio) {
                finalW = Math.min(containerW - 40, originalImage.width);
                finalH = finalW / imgRatio;
            } else {
                finalH = Math.min(containerH - 40, originalImage.height);
                finalW = finalH * imgRatio;
            }

            canvas.style.width = `${finalW}px`;
            canvas.style.height = `${finalH}px`;
        }

        function saveState() {
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (history.length > 20) history.shift();
            else historyStep++;
            updateMemorySextant();
        }

        function updateMemorySextant() {
            // Visualize history depth as Memory Layers
            // 0-5 steps = M0, 5-10 = M1, etc.
            const depth = history.length;
            
            // Reset
            Object.values(memoryLayers).forEach(l => l.classList.remove('active'));
            
            // Set active based on depth
            if (depth > 0) memoryLayers.m0.classList.add('active');
            if (depth > 5) memoryLayers.m1.classList.add('active');
            if (depth > 10) memoryLayers.m2.classList.add('active');
            if (depth > 15) memoryLayers.m3.classList.add('active');
        }

        function loadImage(src) {
            const img = new Image();
            img.onload = () => {
                originalImage = img;
                resizeCanvas();
                ctx.drawImage(img, 0, 0);
                history = [];
                historyStep = -1;
                saveState();
                document.getElementById('placeholder-text').style.display = 'none';
                canvas.style.opacity = 0;
                setTimeout(() => canvas.style.opacity = 1, 200);
            };
            img.src = src;
        }

        // -- TEMPORAL VALUE APPLICATION --

        function applyTemporalField(x, y) {
            const r = parseInt(radius);
            const startX = Math.max(0, x - r);
            const startY = Math.max(0, y - r);
            const endX = Math.min(canvas.width, x + r);
            const endY = Math.min(canvas.height, y + r);
            const w = endX - startX;
            const h = endY - startY;

            if (w <= 0 || h <= 0) return;

            const imageData = ctx.getImageData(startX, startY, w, h);
            const pixels = imageData.data;
            const tempCopy = new Uint8ClampedArray(pixels); // Snapshot for ref
            const rSq = r * r;

            // XQE LOGIC MAP
            // Mode 1: Cascade (Distortion/Bulge) - Represents Potential
            // Mode 2: Retro (Lighten/Glow) - Represents Validation
            // Mode 3: Standing (Blur/Average) - Represents Stabilization

            for (let ly = 0; ly < h; ly++) {
                for (let lx = 0; lx < w; lx++) {
                    const trueX = startX + lx;
                    const trueY = startY + ly;
                    const dx = trueX - x;
                    const dy = trueY - y;
                    const distSq = dx*dx + dy*dy;

                    if (distSq < rSq) {
                        const dist = Math.sqrt(distSq);
                        let percent = dist / r;
                        const idx = (ly * w + lx) * 4;

                        // -- ALGORITHM 1: FORWARD CASCADE (Distortion) --
                        if (currentMode === modes.CASCADE) {
                            // Sinusoidal ingression
                            let effect = Math.sin((Math.PI / 2) * (1 - percent)) * amplitude;
                            let sourcePercent = percent * (1 - effect);
                            if (sourcePercent < 0) sourcePercent = 0;
                            let ratio = (dist > 0.1) ? sourcePercent / percent : 1;
                            
                            // Geometric mapping
                            const srcDX = dx * ratio;
                            const srcDY = dy * ratio;
                            let srcLX = lx - dx + srcDX; 
                            let srcLY = ly - dy + srcDY;
                            const srcIntX = Math.round(srcLX);
                            const srcIntY = Math.round(srcLY);

                            if (srcIntX >= 0 && srcIntX < w && srcIntY >= 0 && srcIntY < h) {
                                const srcIdx = (srcIntY * w + srcIntX) * 4;
                                pixels[idx] = tempCopy[srcIdx]; 
                                pixels[idx + 1] = tempCopy[srcIdx + 1]; 
                                pixels[idx + 2] = tempCopy[srcIdx + 2];
                            }
                        }

                        // -- ALGORITHM 2: RETROACTIVE ILLUMINATION (Light) --
                        else if (currentMode === modes.RETRO) {
                            // Additive lighting based on coherence (center strong)
                            let light = (1 - percent) * (amplitude * 50);
                            pixels[idx] = Math.min(255, pixels[idx] + light);     // R
                            pixels[idx+1] = Math.min(255, pixels[idx+1] + light); // G
                            pixels[idx+2] = Math.min(255, pixels[idx+2] + light); // B
                        }

                        // -- ALGORITHM 3: STANDING WAVE (Stabilize/Blur) --
                        else if (currentMode === modes.STANDING) {
                            // Simple box blur to stabilize noise
                            // Access neighbors
                            if (lx > 1 && ly > 1 && lx < w-2 && ly < h-2) {
                                let rAcc=0, gAcc=0, bAcc=0;
                                let count = 0;
                                // 3x3 kernel
                                for(let ky=-1; ky<=1; ky++){
                                    for(let kx=-1; kx<=1; kx++){
                                        const nIdx = ((ly+ky)*w + (lx+kx))*4;
                                        rAcc += tempCopy[nIdx];
                                        gAcc += tempCopy[nIdx+1];
                                        bAcc += tempCopy[nIdx+2];
                                        count++;
                                    }
                                }
                                pixels[idx] = rAcc/count;
                                pixels[idx+1] = gAcc/count;
                                pixels[idx+2] = bAcc/count;
                            }
                        }
                    }
                }
            }
            ctx.putImageData(imageData, startX, startY);
        }

        // -- INPUT & NAVIGATION --

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let cx = e.touches ? e.touches[0].clientX : e.clientX;
            let cy = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (cx - rect.left) * scaleX,
                y: (cy - rect.top) * scaleY,
                screenX: cx, screenY: cy
            };
        }

        function updateCoherenceCompass(velocity) {
            // Simulate τ calculation based on smoothness of input
            // Map 0-100 velocity to -90deg to +90deg compass needle
            // Slow/Steady = High Coherence (North/Up)
            // Fast/Erratic = Low Coherence (South/Down) OR Dissonant
            
            // Normalized 0-1
            let coherence = Math.max(0, 1 - (velocity / 50)); 
            let angle = (1 - coherence) * 180 - 90; // -90 (North) to 90 (South) inverted for CSS rotate
            // Actually CSS rotate: 0 is up? No, usually 0 is right.
            // Let's assume needle points UP at 0deg.
            // Angle range: -45 (Left/West) to 45 (Right/East)? 
            // Let's do: 0deg = High Coherence (North). 180deg = Low (South).
            
            let needleAngle = (1 - coherence) * 180; // 0 to 180
            if (Math.random() > 0.8) needleAngle += (Math.random()*10 - 5); // Jitter
            
            compassNeedle.style.transform = `translateX(-50%) rotate(${needleAngle}deg)`;
            compassNeedle.style.backgroundColor = coherence > 0.7 ? 'var(--coherence-teal)' : 'var(--entropy-red)';
            compassVal.innerText = `τₖ: ${coherence.toFixed(2)}`;
            compassVal.style.color = coherence > 0.7 ? 'var(--coherence-teal)' : 'var(--entropy-red)';
            
            // Cursor Label update
            cursorLabel.innerText = `τₖ: ${coherence.toFixed(2)} [M${Math.min(3, Math.floor(history.length/5))}]`;
            cursorLabel.style.borderColor = coherence > 0.7 ? 'var(--coherence-teal)' : 'var(--entropy-red)';
        }

        let lastMouse = {x:0, y:0, t:0};
        function handleInput(e) {
            if (!originalImage) return;
            e.preventDefault();
            const coords = getCoordinates(e);
            
            // Physics Calc
            let now = Date.now();
            let dt = now - lastMouse.t;
            let dist = Math.sqrt(Math.pow(coords.screenX - lastMouse.x, 2) + Math.pow(coords.screenY - lastMouse.y, 2));
            let velocity = dt > 0 ? dist/dt : 0;
            
            lastMouse = {x: coords.screenX, y: coords.screenY, t: now};
            
            // UI Updates
            updateCursor(coords.screenX, coords.screenY);
            updateCoherenceCompass(velocity * 10); // scale up

            if (isDragging) {
                requestAnimationFrame(() => applyTemporalField(coords.x, coords.y));
            }
        }

        function updateCursor(x, y) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / canvas.width;
            const cssRadius = radius * scaleX * 2;
            
            cursor.style.width = `${cssRadius}px`;
            cursor.style.height = `${cssRadius}px`;
            cursor.style.left = `${x}px`;
            cursor.style.top = `${y}px`;
            cursor.style.display = 'flex';
        }

        // -- EVENT BINDINGS --

        container.addEventListener('mousedown', (e) => { isDragging = true; handleInput(e); });
        container.addEventListener('mousemove', handleInput);
        window.addEventListener('mouseup', () => { 
            if(isDragging) { isDragging = false; saveState(); } 
        });
        
        container.addEventListener('touchstart', (e) => { isDragging = true; handleInput(e); }, {passive: false});
        container.addEventListener('touchmove', handleInput, {passive: false});
        window.addEventListener('touchend', () => { 
            if(isDragging) { isDragging = false; saveState(); } 
        });

        container.addEventListener('mouseenter', () => { if(originalImage) cursor.style.display = 'flex'; });
        container.addEventListener('mouseleave', () => cursor.style.display = 'none');

        // File Input
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (evt) => loadImage(evt.target.result);
                reader.readAsDataURL(e.target.files[0]);
            }
        });


        // Mode Switching
        const btnCascade = document.getElementById('mode-cascade');
        const btnRetro = document.getElementById('mode-retro');
        const btnStanding = document.getElementById('mode-standing');
        
        function setMode(mode, btn) {
            currentMode = mode;
            [btnCascade, btnRetro, btnStanding].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Cursor Color Change
            if(mode === modes.CASCADE) cursor.querySelector('div:nth-child(2)').style.borderColor = 'var(--coherence-teal)';
            if(mode === modes.RETRO) cursor.querySelector('div:nth-child(2)').style.borderColor = 'var(--xenial-gold)';
            if(mode === modes.STANDING) cursor.querySelector('div:nth-child(2)').style.borderColor = 'var(--memory-purple)';
        }

        btnCascade.addEventListener('click', () => setMode(modes.CASCADE, btnCascade));
        btnRetro.addEventListener('click', () => setMode(modes.RETRO, btnRetro));
        btnStanding.addEventListener('click', () => setMode(modes.STANDING, btnStanding));

        // Sliders
        document.getElementById('radius').addEventListener('input', (e) => {
            radius = parseInt(e.target.value);
            document.getElementById('val-radius').innerText = radius + 'px';
        });
        document.getElementById('power').addEventListener('input', (e) => {
            amplitude = parseInt(e.target.value) / 100;
            document.getElementById('val-power').innerText = amplitude.toFixed(2);
        });

        // Meta
        document.getElementById('resetBtn').addEventListener('click', () => {
            if(originalImage) loadImage(originalImage.src);
        });
        
        document.getElementById('undoBtn').addEventListener('click', () => {
            if (historyStep > 0) {
                historyStep--;
                ctx.putImageData(history[historyStep], 0, 0);
                updateMemorySextant();
            }
        });
        
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!originalImage) return;
            const link = document.createElement('a');
            link.download = `temporal_artifact_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        window.addEventListener('resize', resizeCanvas);

    </script>
</body>
</html>
